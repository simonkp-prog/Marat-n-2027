<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Maratón 2027</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maratón">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232635;
    --border: #2e3249;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e8f0;
    --muted: #8892a4;
    --stage1: #6c63ff;
    --stage2: #f59e0b;
    --stage3: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px; position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  header h1 span { font-size: 1.6rem; }
  .header-stats { display: flex; gap: 16px; flex-wrap: wrap; }
  .hstat { text-align: center; }
  .hstat-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
  .hstat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  /* Stage tabs */
  .stage-tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .stage-tab { padding: 8px 16px; border-radius: 20px; border: 2px solid transparent; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; background: var(--surface); color: var(--muted); }
  .stage-tab.active { color: white; }
  .stage-tab[data-stage="0"].active { border-color: var(--stage1); background: var(--stage1)22; color: var(--stage1); }
  .stage-tab[data-stage="1"].active { border-color: var(--stage2); background: var(--stage2)22; color: var(--stage2); }
  .stage-tab[data-stage="2"].active { border-color: var(--stage3); background: var(--stage3)22; color: var(--stage3); }
  .stage-tab:hover { border-color: var(--border); color: var(--text); }

  /* Stage progress card */
  .stage-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; }
  .stage-card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .stage-badge { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .stage-progress-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; }
  .prog-item { flex: 1; min-width: 120px; }
  .prog-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .prog-val { font-size: 1.4rem; font-weight: 700; }
  .prog-sub { font-size: 0.75rem; color: var(--muted); }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

  /* Weeks */
  .week-list { display: flex; flex-direction: column; gap: 8px; }
  .week-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .week-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; user-select: none; transition: background 0.15s; }
  .week-header:hover { background: var(--surface2); }
  .week-num { font-size: 0.75rem; font-weight: 700; color: var(--muted); min-width: 70px; }
  .week-date { font-size: 0.78rem; color: var(--muted); min-width: 100px; }
  .week-dots { display: flex; gap: 4px; flex: 1; }
  .wdot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .wdot.rest { background: var(--border); }
  .wdot.pending { background: var(--accent)55; border: 1px solid var(--accent)88; }
  .wdot.done { background: var(--green); }
  .wdot.skipped { background: var(--red)99; }
  .wdot.partial { background: var(--yellow); }
  .week-km { font-size: 0.8rem; color: var(--muted); text-align: right; min-width: 80px; }
  .week-km strong { color: var(--text); }
  .week-chevron { color: var(--muted); font-size: 0.8rem; transition: transform 0.2s; }
  .week-item.open .week-chevron { transform: rotate(180deg); }
  .week-item.current .week-header { border-left: 3px solid var(--accent); }

  /* Days grid */
  .days-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; padding: 12px 16px 16px; border-top: 1px solid var(--border); }
  .day-card { background: var(--surface2); border: 2px solid transparent; border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all 0.15s; position: relative; }
  .day-card:hover { border-color: var(--border); }
  .day-card.rest { opacity: 0.4; cursor: default; }
  .day-card.done { border-color: var(--green)66; background: #16332466; }
  .day-card.skipped { border-color: var(--red)44; background: #3a1a1a66; }
  .day-card.partial { border-color: var(--yellow)66; background: #2e210066; }
  .day-card.pending:hover { border-color: var(--accent)66; }
  .day-name { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
  .day-workout { font-size: 0.8rem; line-height: 1.4; color: var(--text); flex: 1; }
  .day-km { font-size: 0.72rem; font-weight: 700; color: var(--accent); margin-top: 6px; }
  .day-status-badge { position: absolute; top: 8px; right: 8px; font-size: 0.85rem; }
  .day-actual { margin-top: 8px; display: flex; align-items: center; gap: 6px; }
  .day-actual input { width: 56px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 3px 6px; font-size: 0.78rem; }
  .day-actual label { font-size: 0.72rem; color: var(--muted); }

  /* Race day */
  .day-card.race { border-color: var(--accent2)88; background: #2a1a2e66; }
  .day-card.race .day-workout { color: var(--accent2); font-weight: 700; }

  /* Empty stage message */
  .empty-stage { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-stage p { margin-top: 8px; font-size: 0.9rem; }

  /* Tooltip for status cycle */
  .status-hint { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .no-plan-badge { display: inline-block; background: var(--yellow)22; color: var(--yellow); border: 1px solid var(--yellow)44; border-radius: 4px; font-size: 0.7rem; padding: 2px 6px; margin-left: 8px; }

  /* Day date */
  .day-date { font-size: 0.72rem; color: var(--muted); margin-bottom: 6px; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: #000000bb; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 440px; overflow: hidden; transform: translateY(16px); transition: transform 0.2s; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
  .modal-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .modal-day-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
  .modal-day-date { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 0; flex-shrink: 0; }
  .modal-close:hover { color: var(--text); }
  .modal-workout { margin-top: 12px; font-size: 0.88rem; color: var(--text); line-height: 1.5; background: var(--surface2); border-radius: 8px; padding: 10px 12px; }
  .modal-km-plan { font-size: 0.75rem; color: var(--accent); margin-top: 6px; font-weight: 600; }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
  .modal-section-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
  .status-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .status-btn { padding: 10px 8px; border-radius: 8px; border: 2px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.15s; text-align: center; }
  .status-btn:hover { border-color: var(--border); color: var(--text); }
  .status-btn.active-done   { border-color: var(--green);  background: #16332466; color: var(--green); }
  .status-btn.active-partial{ border-color: var(--yellow); background: #2e210066; color: var(--yellow); }
  .status-btn.active-skipped{ border-color: var(--red);    background: #3a1a1a66; color: var(--red); }
  .status-btn.active-pending{ border-color: var(--muted);  background: var(--surface2); color: var(--muted); }
  .km-input-row { display: flex; align-items: center; gap: 10px; }
  .km-input-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 0.95rem; outline: none; }
  .km-input-row input:focus { border-color: var(--accent); }
  .km-input-row span { font-size: 0.85rem; color: var(--muted); }
  .notes-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 0.85rem; resize: vertical; min-height: 72px; font-family: inherit; outline: none; }
  .notes-input:focus { border-color: var(--accent); }
  .modal-footer { padding: 0 20px 20px; display: flex; gap: 10px; }
  .btn-save { flex: 1; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
  .btn-save:hover { opacity: 0.85; }
  .btn-cancel { padding: 12px 18px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  .btn-cancel:hover { color: var(--text); }

  @media (max-width: 600px) {
    .days-grid { grid-template-columns: 1fr 1fr; }
    .week-date { display: none; }
    .header-stats { gap: 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1><span>🏃</span> Plan Maratón 2027</h1>
    <div class="header-stats">
      <div class="hstat"><div class="hstat-val" id="stat-done">0</div><div class="hstat-label">Entrenos ✓</div></div>
      <div class="hstat"><div class="hstat-val" id="stat-km-done">0</div><div class="hstat-label">km corridos</div></div>
      <div class="hstat"><div class="hstat-val" id="stat-km-plan">0</div><div class="hstat-label">km planif.</div></div>
      <div class="hstat"><div class="hstat-val" id="stat-pct">0%</div><div class="hstat-label">Cumplimiento</div></div>
    </div>
  </div>
</header>

<main>
  <div class="stage-tabs" id="stageTabs"></div>
  <div class="stage-card" id="stageCard"></div>
  <div class="week-list" id="weekList"></div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-header-top">
        <div>
          <div class="modal-day-label" id="modalDayLabel"></div>
          <div class="modal-day-date" id="modalDayDate"></div>
        </div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-workout" id="modalWorkout"></div>
      <div class="modal-km-plan" id="modalKmPlan"></div>
    </div>
    <div class="modal-body">
      <div>
        <div class="modal-section-label">¿Cómo fue el entreno?</div>
        <div class="status-btns">
          <button class="status-btn" data-status="done"    onclick="modalSetStatus('done')">✓ Completado</button>
          <button class="status-btn" data-status="partial" onclick="modalSetStatus('partial')">◑ Parcial</button>
          <button class="status-btn" data-status="skipped" onclick="modalSetStatus('skipped')">✗ Salteado</button>
          <button class="status-btn" data-status="pending" onclick="modalSetStatus('pending')">○ Pendiente</button>
        </div>
      </div>
      <div>
        <div class="modal-section-label">Kilómetros reales corridos</div>
        <div class="km-input-row">
          <input type="number" id="modalKmInput" min="0" max="100" step="0.5" placeholder="0">
          <span>km</span>
        </div>
      </div>
      <div>
        <div class="modal-section-label">Notas (opcional)</div>
        <textarea class="notes-input" id="modalNotes" placeholder="Cómo te sentiste, condiciones, tiempos..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveModal()">Guardar</button>
    </div>
  </div>
</div>

// ── STATE ─────────────────────────────────────────────────────────────────────
// status: 'pending' | 'done' | 'skipped' | 'partial'
// actualKm: number
const STORAGE_KEY = 'maraton2027';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

let state = loadState();
let activeStage = 0;
let openWeeks = new Set();

function dayKey(wi, di) { return `w${wi}_d${di}`; }

function getStatus(wi, di) { return state[dayKey(wi,di)]?.status || 'pending'; }
function getActual(wi, di) { return state[dayKey(wi,di)]?.actual ?? null; }
function getNotes(wi, di)  { return state[dayKey(wi,di)]?.notes ?? ''; }

function saveDay(wi, di, status, actual, notes) {
  const k = dayKey(wi, di);
  state[k] = { status, actual: actual || null, notes: notes || '' };
  saveState(state);
  render();
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function dayDate(wi, di) {
  // week date is the Monday (di=0); di=0→Mon, 1→Tue, ... 6→Sun
  const d = new Date(WEEKS[wi].date + 'T12:00:00');
  d.setDate(d.getDate() + di);
  return d;
}

function formatDayDate(wi, di) {
  return dayDate(wi, di).toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long' });
}

function formatDayDateShort(wi, di) {
  return dayDate(wi, di).toLocaleDateString('es-CL', { day:'numeric', month:'short' });
}

function stageOf(wi) {
  for (const s of STAGES) if (wi >= s.weeks[0] && wi <= s.weeks[1]) return STAGES.indexOf(s);
  return 0;
}

function stageStats(si) {
  const s = STAGES[si];
  let planKm = 0, doneKm = 0, plannedDays = 0, doneDays = 0, skippedDays = 0;
  for (let wi = s.weeks[0]; wi <= s.weeks[1]; wi++) {
    WEEKS[wi].days.forEach((d, di) => {
      if (!d) return;
      planKm += d.km;
      plannedDays++;
      const st = getStatus(wi, di);
      const actual = getActual(wi, di);
      if (st === 'done')    { doneDays++;  doneKm += actual ?? d.km; }
      else if (st === 'partial') { doneDays++;  doneKm += actual ?? d.km * 0.5; }
      else if (st === 'skipped') skippedDays++;
    });
  }
  return { planKm, doneKm, plannedDays, doneDays, skippedDays };
}

function totalStats() {
  let planKm = 0, doneKm = 0, doneDays = 0;
  WEEKS.forEach((w, wi) => {
    w.days.forEach((d, di) => {
      if (!d) return;
      planKm += d.km;
      const st = getStatus(wi, di);
      const actual = getActual(wi, di);
      if (st === 'done')    { doneDays++; doneKm += actual ?? d.km; }
      else if (st === 'partial') { doneDays++; doneKm += actual ?? d.km * 0.5; }
    });
  });
  return { planKm, doneKm, doneDays };
}

function formatDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('es-CL', { day:'numeric', month:'short' });
}

function isCurrentWeek(wi) {
  const now = new Date();
  const wStart = new Date(WEEKS[wi].date + 'T00:00:00');
  const wEnd = new Date(wStart); wEnd.setDate(wEnd.getDate() + 7);
  return now >= wStart && now < wEnd;
}

function isPastWeek(wi) {
  const now = new Date();
  const wEnd = new Date(WEEKS[wi].date + 'T00:00:00');
  wEnd.setDate(wEnd.getDate() + 7);
  return now >= wEnd;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  renderStageTabs();
  renderStageCard();
  renderWeeks();
  updateHeaderStats();
}

function updateHeaderStats() {
  const { planKm, doneKm, doneDays } = totalStats();
  document.getElementById('stat-done').textContent = doneDays;
  document.getElementById('stat-km-done').textContent = Math.round(doneKm);
  document.getElementById('stat-km-plan').textContent = Math.round(planKm);
  const pct = planKm > 0 ? Math.round(doneKm / planKm * 100) : 0;
  document.getElementById('stat-pct').textContent = pct + '%';
}

function renderStageTabs() {
  const el = document.getElementById('stageTabs');
  el.innerHTML = STAGES.map((s, i) => `
    <div class="stage-tab ${i===activeStage?'active':''}" data-stage="${i}" onclick="switchStage(${i})">
      ${s.short} <span style="color:${s.color};font-size:0.7rem">●</span>
    </div>
  `).join('');
}

function renderStageCard() {
  const el = document.getElementById('stageCard');
  const s = STAGES[activeStage];
  const st = stageStats(activeStage);
  const isEmpty = st.planKm === 0;
  const pct = st.planKm > 0 ? Math.round(st.doneKm / st.planKm * 100) : 0;
  const compliance = st.doneDays + st.skippedDays > 0
    ? Math.round(st.doneDays / (st.doneDays + st.skippedDays) * 100) : 0;

  el.innerHTML = `
    <h2>
      <span class="stage-badge" style="background:${s.color}"></span>
      ${s.name}
      ${isEmpty ? '<span class="no-plan-badge">Sin planificar</span>' : ''}
    </h2>
    ${isEmpty
      ? `<div style="color:var(--muted);font-size:0.85rem">Esta etapa aún no tiene entrenamientos planificados. Podrás agregar los entrenos cuando definas el plan de velocidad.</div>`
      : `<div class="stage-progress-row">
          <div class="prog-item">
            <div class="prog-label">km planificados</div>
            <div class="prog-val" style="color:${s.color}">${Math.round(st.planKm)}</div>
          </div>
          <div class="prog-item">
            <div class="prog-label">km corridos</div>
            <div class="prog-val">${Math.round(st.doneKm)}</div>
            <div class="prog-sub">${pct}% del plan</div>
          </div>
          <div class="prog-item">
            <div class="prog-label">Entrenos completados</div>
            <div class="prog-val">${st.doneDays}<span style="font-size:0.85rem;color:var(--muted)">/${st.plannedDays}</span></div>
          </div>
          <div class="prog-item">
            <div class="prog-label">Salteados</div>
            <div class="prog-val" style="color:var(--red)">${st.skippedDays}</div>
          </div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%;background:${s.color}"></div>
        </div>`
    }
  `;
}

function renderWeeks() {
  const el = document.getElementById('weekList');
  const s = STAGES[activeStage];
  const wStart = s.weeks[0], wEnd = s.weeks[1];

  el.innerHTML = '';
  for (let wi = wStart; wi <= wEnd; wi++) {
    const w = WEEKS[wi];
    const isCur = isCurrentWeek(wi);
    const isOpen = openWeeks.has(wi) || isCur;

    // compute week stats
    let planKm = 0, doneKm = 0;
    const dots = w.days.map((d, di) => {
      if (!d) return 'rest';
      planKm += d.km;
      const st = getStatus(wi, di);
      if (st === 'done') doneKm += getActual(wi, di) ?? d.km;
      else if (st === 'partial') doneKm += getActual(wi, di) ?? d.km * 0.5;
      return st;
    });

    const div = document.createElement('div');
    div.className = `week-item${isCur?' current':''}${isOpen?' open':''}`;
    div.innerHTML = `
      <div class="week-header" onclick="toggleWeek(${wi})">
        <span class="week-num">Semana ${w.n}</span>
        <span class="week-date">${formatDate(w.date)}</span>
        <div class="week-dots">${dots.map(st=>`<div class="wdot ${st}"></div>`).join('')}</div>
        <span class="week-km">${Math.round(doneKm)} / <strong>${Math.round(planKm)} km</strong></span>
        <span class="week-chevron">▼</span>
      </div>
      ${isOpen ? renderDaysGrid(wi) : ''}
    `;
    el.appendChild(div);
  }
}

function renderDaysGrid(wi) {
  const w = WEEKS[wi];
  const icons  = { pending:'○', done:'✓', skipped:'✗', partial:'◑' };
  const colors = { done:'var(--green)', skipped:'var(--red)', partial:'var(--yellow)', pending:'var(--muted)' };

  const cards = w.days.map((d, di) => {
    const dateShort = formatDayDateShort(wi, di);
    if (!d) return `
      <div class="day-card rest">
        <div class="day-name">${DAYS_ES[di]}</div>
        <div class="day-date">${dateShort}</div>
        <div class="day-workout" style="color:var(--muted);font-size:0.75rem">Descanso</div>
      </div>`;
    const st = getStatus(wi, di);
    const actual = getActual(wi, di);
    const notes  = getNotes(wi, di);
    return `
      <div class="day-card ${st} ${d.race?'race':''}" onclick="openModal(${wi},${di})">
        <div class="day-status-badge" style="color:${colors[st]}">${icons[st]}</div>
        <div class="day-name">${DAYS_ES[di]}</div>
        <div class="day-date">${dateShort}</div>
        <div class="day-workout">${d.desc}</div>
        <div class="day-km">${d.km} km planif.${actual != null ? ` · <span style="color:var(--text)">${actual} km reales</span>` : ''}</div>
        ${notes ? `<div style="font-size:0.72rem;color:var(--muted);margin-top:5px;font-style:italic">"${notes}"</div>` : ''}
      </div>`;
  }).join('');
  return `<div class="days-grid">${cards}</div>`;
}

// ── INTERACTIONS ──────────────────────────────────────────────────────────────
function switchStage(i) {
  activeStage = i;
  render();
  const s = STAGES[i];
  for (let wi = s.weeks[0]; wi <= s.weeks[1]; wi++) {
    if (isCurrentWeek(wi)) { openWeeks.add(wi); break; }
  }
}

function toggleWeek(wi) {
  if (openWeeks.has(wi)) openWeeks.delete(wi);
  else openWeeks.add(wi);
  renderWeeks();
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
let modalWi = null, modalDi = null, modalStatus = 'pending';

function openModal(wi, di) {
  const d = WEEKS[wi].days[di];
  if (!d) return;

  modalWi = wi; modalDi = di;
  modalStatus = getStatus(wi, di);

  document.getElementById('modalDayLabel').textContent = DAYS_ES[di] + ' · Semana ' + WEEKS[wi].n;
  document.getElementById('modalDayDate').textContent = formatDayDate(wi, di);
  document.getElementById('modalWorkout').textContent = d.desc;
  document.getElementById('modalKmPlan').textContent = d.km + ' km planificados';
  document.getElementById('modalKmInput').value = getActual(wi, di) ?? '';
  document.getElementById('modalKmInput').placeholder = d.km;
  document.getElementById('modalNotes').value = getNotes(wi, di);

  updateStatusBtns();
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  modalWi = null; modalDi = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function modalSetStatus(s) {
  modalStatus = s;
  updateStatusBtns();
}

function updateStatusBtns() {
  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.className = 'status-btn';
    if (btn.dataset.status === modalStatus) btn.classList.add('active-' + modalStatus);
  });
}

function saveModal() {
  if (modalWi === null) return;
  const kmVal = parseFloat(document.getElementById('modalKmInput').value) || null;
  const notes = document.getElementById('modalNotes').value.trim();
  saveDay(modalWi, modalDi, modalStatus, kmVal, notes);
  closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── INIT ──────────────────────────────────────────────────────────────────────
// Find current stage
(function initStage() {
  const now = new Date();
  for (let si = 0; si < STAGES.length; si++) {
    const s = STAGES[si];
    const firstDate = new Date(WEEKS[s.weeks[0]].date + 'T00:00:00');
    const lastDate = new Date(WEEKS[s.weeks[1]].date + 'T00:00:00');
    lastDate.setDate(lastDate.getDate() + 7);
    if (now >= firstDate && now < lastDate) { activeStage = si; break; }
    if (now < firstDate) { activeStage = si; break; }
  }
})();

// Open current week by default
for (let wi = 0; wi < WEEKS.length; wi++) {
  if (isCurrentWeek(wi)) { openWeeks.add(wi); break; }
}

render();

// ── SERVICE WORKER ────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
